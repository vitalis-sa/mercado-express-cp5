services:

  postgres:
    image: postgres:16
    container_name: mercadoexpress-postgres
    environment:
      POSTGRES_DB: mercadoexpress
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mercadoexpress-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

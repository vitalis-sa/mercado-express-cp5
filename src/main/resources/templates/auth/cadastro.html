<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Cadastro - Mercado Express</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">
        <h2>Criar conta</h2>

        <div th:if="${erro}" class="login-erro" th:text="${erro}"></div>

        <form th:action="@{/cadastro}" method="post">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" autofocus required/>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required/>
            </div>
            <div class="form-group">
                <label for="senha">Senha (mín. 6 caracteres)</label>
                <input type="password" id="senha" name="senha" minlength="6" required/>
            </div>
            <button type="submit" class="btn btn-verde" style="width:100%">Cadastrar</button>
        </form>

        <p class="login-link">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</div>

</body>
</html>
